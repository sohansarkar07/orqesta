version: '3.8'

services:
  # Self-hosted Flagsmith (PostgreSQL-backed)
  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: flagsmith
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
      ENV: production
      DJANGO_ALLOWED_HOSTS: "*"
      ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
    depends_on:
      - postgres
    networks:
      - orqesta-network

  postgres:
    image: postgres:14-alpine
    container_name: flagsmith-db
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orqesta-network

  # Orqesta API + Web UI (optional - can also run locally)
  orqesta:
    build: .
    container_name: orqesta
    ports:
      - "3001:3001"
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1
      # Set this after creating an org + API key in Flagsmith UI
      # FLAGSMITH_API_KEY: ser.xxxxxxxxxxxxxxxx
    depends_on:
      - flagsmith
    networks:
      - orqesta-network

volumes:
  postgres-data:

networks:
  orqesta-network:
    driver: bridge
