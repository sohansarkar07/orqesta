version: '3.8'

# Self-hosted Flagsmith + Orqesta
#
# After starting:
#   1. Open http://localhost:8000 — create admin account + organisation
#   2. Create a project + two environments (e.g. Staging, Production)
#   3. Go to Organisation → API Access → Create API Key
#   4. Copy the token and set it below (ORQUESTA_API_TOKEN) OR in Orqesta Settings UI
#   5. Open Orqesta: http://localhost:3001
#
# Note: inside Docker the Flagsmith API is at http://flagsmith:8000/api/v1
# From your host browser the same URL is http://localhost:8000/api/v1

services:
  # Self-hosted Flagsmith (PostgreSQL-backed)
  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: flagsmith
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
      ENV: production
      DJANGO_ALLOWED_HOSTS: "*"
      ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
    depends_on:
      - postgres
    networks:
      - orqesta-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:14-alpine
    container_name: flagsmith-db
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orqesta-network

  # Orqesta API + Web UI
  orqesta:
    build: .
    container_name: orqesta
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Management API — container-to-container URL
      ORQUESTA_API_URL: http://flagsmith:8000/api/v1
      # Set after creating an org + API key in Flagsmith UI:
      # ORQUESTA_API_TOKEN: your_token_here
      # Flags API — also points to self-hosted
      ORQUESTA_FLAGS_API_URL: http://flagsmith:8000/api/v1
    depends_on:
      flagsmith:
        condition: service_healthy
    networks:
      - orqesta-network

volumes:
  postgres-data:

networks:
  orqesta-network:
    driver: bridge
