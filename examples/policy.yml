# Orqesta Policy File — Example Configuration
# Place this in your repo root as .orqesta-policy.yml
# Run: orqesta lint Production --policy ./examples/policy.yml

version: 1

policies:
  # ─── Naming Convention ────────────────────────────────────────────────────────
  - id: naming-convention
    description: Flag names must be snake_case (lowercase with underscores only)
    severity: warning
    rule: naming_convention
    pattern: "^[a-z][a-z0-9_]*$"

  # ─── Required Descriptions ────────────────────────────────────────────────────
  - id: production-descriptions
    description: Production flags must have descriptions for team clarity
    severity: error
    rule: require_description
    environments:
      - Production

  - id: staging-descriptions
    description: Staging flags should have descriptions
    severity: warning
    rule: require_description
    environments:
      - Staging

  # ─── No Archived Flags Enabled ────────────────────────────────────────────────
  - id: no-archived-enabled
    description: Archived flags must not be enabled in any environment
    severity: error
    rule: no_archived_flags_enabled

  # ─── Multivariate Allocation ──────────────────────────────────────────────────
  - id: valid-multivariate
    description: Multivariate allocations must sum to exactly 100%
    severity: error
    rule: multivariate_allocations_sum

  # ─── Cross-Environment Parity ─────────────────────────────────────────────────
  - id: staging-prod-parity
    description: Features enabled in Development must also be enabled in Production
    severity: warning
    rule: environment_parity
    parity_source: Development
    environments:
      - Production
